name: Android APK Build Diagnostic

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: unzip aurawavex.zip -d project_folder

      - name: Inspect Extracted Files
        run: |
          echo "=== ROOT FILES ==="
          ls -la project_folder/
          echo "=== FINDING GRADLE AND CONFIG FILES ==="
          find project_folder -name "build.gradle" -o -name "package.json" -o -name "gradlew"
          
