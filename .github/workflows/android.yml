name: Android APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Extract Project Zip
        run: unzip aurawavex.zip -d project_folder
        
      - name: Build APK with Gradle
        run: |
          cd project_folder
          if [ -f ./gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found, setting up generic Android build..."
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurawavex-app
          path: project_folder/app/build/outputs/apk/debug/*.apk
